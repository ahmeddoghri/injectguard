[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injectguard"
version = "0.1.0"
description = "A fast, transparent, dependency-free prompt-injection and jailbreak detector, with a red-team benchmark so you can measure precision and recall instead of hoping."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Doghri" }]
keywords = ["llm", "prompt-injection", "jailbreak", "security", "guardrails", "ai-safety", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ahmeddoghri/injectguard"

[tool.hatch.build.targets.wheel]
packages = ["injectguard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
